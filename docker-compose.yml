services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: orderapp
      RABBITMQ_DEFAULT_PASS: orderapp-dev
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  api:
    restart: unless-stopped
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      RABBITMQ_URL: amqp://orderapp:orderapp-dev@rabbitmq/
      DATABASE_PATH: /data/orders.db
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    volumes:
      - order-data:/data

  worker:
    build: .
    command: python worker.py
    environment:
      RABBITMQ_URL: amqp://orderapp:orderapp-dev@rabbitmq/
      DATABASE_PATH: /data/orders.db
      ORDER_STAGE_DELAY_SECONDS: 2
    volumes:
      - order-data:/data
    deploy:
      replicas: 2
    restart: unless-stopped

  notification:
    build: ./notification_service
    environment:
      RABBITMQ_URL: amqp://orderapp:orderapp-dev@rabbitmq/
    ports:
      - "8001:8080"
    restart: unless-stopped

volumes:
  order-data: